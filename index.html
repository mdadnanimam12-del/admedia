  prof2:u=>{$('sheet').classList.remove('open');A.prof(u)},
  pick:v=>{accType=v;setMode('signup')},mode:v=>setMode(v),submit,
  post,who,wf:v=>drawWho(v),shc:()=>$('sheet').classList.remove('open'),shx:(v,b,e)=>{if(e.target.id==='sheet')A.shc()},
  react:v=>{const[i,e]=v.split('|'),p=POSTS.find(x=>x.id===i)||PP.find(x=>x.id===i),had=p&&(p.reactions||{})[me];run(async()=>{await updateDoc(doc(db,'posts',i),{['reactions.'+me]:e});if(!had&&p)notify(p.uid,'react',{postId:i,emoji:e})})},
  delPost:id=>{if(confirm('Delete this post?'))run(()=>deleteDoc(doc(db,'posts',id))).then(()=>{PP=PP.filter(p=>p.id!==id);if(tab==='profile')liveProfile()})},
  cm:id=>{if(openC.has(id)){openC.delete(id);cmUn[id]&&cmUn[id]();delete cmUn[id];$('c-'+id).innerHTML=''}else{openC.add(id);cmUn[id]=onSnapshot(query(collection(db,'posts',id,'comments'),orderBy('ts')),s=>{CM[id]=s.docs.map(d=>({id:d.id,...d.data()}));drawC(id)})}},
  rep:v=>{const[i,c]=v.split('|');RT[i]=c;drawC(i).then(()=>{const n=$('c-'+i).querySelector('input');if(n)n.focus()})},
  repx:i=>{delete RT[i];drawC(i)},
  addC:id=>{const i=$('c-'+id).querySelector('input'),t=i.value.trim();if(!t)return;i.value='';
    const par=RT[id]||null,pc=par&&(CM[id]||[]).find(c=>c.id===par),p=POSTS.find(x=>x.id===id)||PP.find(x=>x.id===id);delete RT[id];
    run(async()=>{const d={uid:me,text:t,ts:Date.now()};if(par)d.parent=par;await addDoc(collection(db,'posts',id,'comments'),d);await updateDoc(doc(db,'posts',id),{commentCount:increment(1)});
      if(pc)notify(pc.uid,'reply',{postId:id});else if(p)notify(p.uid,'comment',{postId:id})})},
  add:u=>run(async()=>{await setDoc(doc(db,'friendships',key(me,u)),{users:[me,u].sort(),from:me,to:u,status:'pending',ts:Date.now()});notify(u,'friend_req')}),
  acc:u=>run(async()=>{await updateDoc(doc(db,'friendships',key(me,u)),{status:'accepted'});notify(u,'friend_acc')}),
  del:u=>run(()=>deleteDoc(doc(db,'friendships',key(me,u)))),
  unf:u=>{if(confirm('Remove this friend?'))run(()=>deleteDoc(doc(db,'friendships',key(me,u))))},
  fol:u=>run(async()=>{if(FOL.has(u))await deleteDoc(doc(db,'follows',me+'_'+u));else{await setDoc(doc(db,'follows',me+'_'+u),{uid:me,page:u});notify(u,'follow')}}),
  chat:u=>openChat(u),
  closeChat:()=>{if(chatUn)chatUn();chatUn=null;chatU=null;LM=[];$('mchat').hidden=true;$('mlist').hidden=false;renderMsgs()},
  send:()=>sendMsg(),
  unsend:id=>{if(!confirm('Unsend this message?'))return;const k=key(me,chatU),m=LM.find(x=>x.id===id),c=CH[k];
    run(async()=>{await deleteDoc(doc(db,'chats',k,'messages',id));if(m&&c&&c.last&&c.last.ts===m.ts&&c.last.from===me)await updateDoc(doc(db,'chats',k),{last:{from:me,text:'🚫 Message unsent',ts:m.ts}})})},
  chip:v=>{chip=v;$('c-all').classList.toggle('on',v==='all');$('c-un').classList.toggle('on',v==='un');renderMsgs()},
  edit:()=>$('eb').classList.toggle('on'),
  saveP:()=>{const name=$('en').value.trim();if(!name)return toast('Please enter your name.');const bio=$('ebio').value.trim();
    run(async()=>{await updateDoc(doc(db,'users',me),{name,nameLower:name.toLowerCase(),bio});Object.assign(U[me],{name,nameLower:name.toLowerCase(),bio});renderProfile()})},
  out:async()=>{await signOut(auth);location.reload()}
};
let pt,lp=false;
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.lk');if(!b)return;lp=false;clearTimeout(pt);pt=setTimeout(()=>{lp=true;$('pop-'+b.dataset.id).style.display='flex'},450)});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>clearTimeout(pt)));
document.addEventListener('contextmenu',e=>{if(e.target.closest('.lk'))e.preventDefault()});
document.addEventListener('click',e=>{
  if(!e.target.closest('.lw'))document.querySelectorAll('.pop').forEach(p=>p.style.display='none');
  const l=e.target.closest('.lk');if(l){if(lp){lp=false;return}const id=l.dataset.id,p=POSTS.find(x=>x.id===id)||PP.find(x=>x.id===id);
    const had=p&&(p.reactions||{})[me];run(async()=>{await updateDoc(doc(db,'posts',id),{['reactions.'+me]:had?deleteField():'👍'});if(!had&&p)notify(p.uid,'react',{postId:id,emoji:'👍'})});return}
  const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.v,b,e)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.enter){const[a,v]=e.target.dataset.enter.split('|');A[a==='send'?'send':a](v)}});
document.addEventListener('input',e=>{if(e.target.id==='mi')sendIcon();if(e.target.id==='mq')renderMsgs();if(e.target.id==='pq'){clearTimeout(search.t);search.t=setTimeout(search,300)}});
document.addEventListener('change',async e=>{
  if(e.target.id==='mf'&&e.target.files[0]){const f=e.target.files[0];e.target.value='';try{let d=await img(f,800,false,.7);if(d.length>700000)d=await img(f,560,false,.6);sendMsg(d)}catch(x){toast('Could not send photo.')}}
  if(e.target.id==='pf')$('pn').textContent=e.target.files[0]?'📎 '+e.target.files[0].name:'';
  if(e.target.id==='ph'&&e.target.files[0]){try{const d=await img(e.target.files[0],256,true,.8);await updateDoc(doc(db,'users',me),{photo:d});U[me].photo=d;renderProfile()}catch(x){toast('Could not update photo.')}}});
</script>
</body>
</html>
